name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

workers_dev = true
#routes = [
#	{ pattern = "mail.liveppp.com", custom_domain = true }
#]


[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "cloud-mail-db"		#d1数据库名字
database_id = "65932dc9-e658-4534-984c-1fab4579124f"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "81abe08bae71487da78332513ef4be2e"					#kv数据库id

[[r2_buckets]]
binding = "r2"			#r2对象存储绑定名默认不可修改
bucket_name = "cloud-mail-r2"		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true


[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
orm_log = false			#是否sql日志
domain = ["liveppp.com"]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "admin@liveppp.com"					#管理员的邮箱	示例: admin@example.com
jwt_secret = "fd2880e90e791d26f577aa9e985f2156d3c35a1e3d0a01c4"			#jwt令牌的密钥,随便填一串字符串
dingtalk_webhook_url = "https://oapi.dingtalk.com/robot/send?access_token=ddca26db9528e8d9513e7b783120db9990f58d5af4b38934679f4180ca29e6d5"
dingtalk_secret = ""
dingtalk_target_email = "x-report@liveppp.com"
dingtalk_keywords = "X晨报,x-report,晨报,精报,推特"


#[build]
#command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"

